services:
  bot:
    build: .
    container_name: whisper-telegram-bot
    env_file: .env
    environment:
      - ORT_LOGGING_LEVEL=3  # Suppress ONNX Runtime warnings (0=Verbose, 1=Info, 2=Warning, 3=Error, 4=Fatal)
    volumes:
      # Persist downloaded Whisper models between restarts
      - ./models:/root/.cache/huggingface
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .idea/
            - .venv/
            - .pytest_cache/
            - __pycache__/
            - "**/__pycache__/"
            - "*.pyc"
            - "*.pyo"
            - "*.pyd"
            - .env
            - .env.*
            - .dockerignore
            - .gitignore
            - docker-compose.yml
            - Dockerfile
            - LICENSE
            - README.md
            - models/
            - requirements.txt
        - action: rebuild
          path: ./requirements.txt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

