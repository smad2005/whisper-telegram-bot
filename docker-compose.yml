services:
  bot:
    build:
      context: .
      args:
        WITH_QWEN: ${WITH_QWEN:-0}  # set WITH_QWEN=1 in .env to install Qwen3-ASR deps into the image
    container_name: whisper-telegram-bot
    env_file: .env
    environment:
      - ORT_LOGGING_LEVEL=3  # Suppress ONNX Runtime warnings (0=Verbose, 1=Info, 2=Warning, 3=Error, 4=Fatal)
    volumes:
      # Hugging Face cache (Whisper + Qwen models) on a Docker volume, not a bind mount:
      # transformers mmaps safetensors, which is ~40x slower on a Windows bind mount (9p)
      # than on the WSL ext4 volume.
      - hf-cache:/root/.cache/huggingface
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .idea/
            - .venv/
            - .pytest_cache/
            - __pycache__/
            - "**/__pycache__/"
            - "*.pyc"
            - "*.pyo"
            - "*.pyd"
            - .env
            - .env.*
            - .dockerignore
            - .gitignore
            - docker-compose.yml
            - Dockerfile
            - LICENSE
            - README.md
            - models/
            - requirements.txt
            - requirements-qwen.txt
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./requirements-qwen.txt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


volumes:
  hf-cache:
