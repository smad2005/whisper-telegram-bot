services:
  bot:
    build: .
    container_name: whisper-telegram-bot
    env_file: .env
    volumes:
      # Persist downloaded Whisper models between restarts
      - ./models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

